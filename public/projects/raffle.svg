    <text x="196" y="262" fill="#3d3d3d" text-anchor="end">1</text><text x="230" y="262" fill="#d4d4d4" xml:space="preserve">function fulfillRandomWords(</text><text x="196" y="302" fill="#3d3d3d" text-anchor="end">2</text><text x="230" y="302" fill="#d4d4d4" xml:space="preserve">    uint256, uint256[] calldata randomWords</text><text x="196" y="342" fill="#3d3d3d" text-anchor="end">3</text><text x="230" y="342" fill="#d4d4d4" xml:space="preserve">) internal override {</text><text x="196" y="382" fill="#3d3d3d" text-anchor="end">4</text><text x="230" y="382" fill="#d4d4d4" xml:space="preserve">    uint256 i = randomWords[0] % s_players.length;</text><text x="196" y="422" fill="#3d3d3d" text-anchor="end">5</text><text x="230" y="422" fill="#d4d4d4" xml:space="preserve">    address payable winner = s_players[i];</text><text x="196" y="462" fill="#3d3d3d" text-anchor="end">6</text><text x="230" y="462" fill="#d4d4d4" xml:space="preserve">    s_raffleState = RaffleState.OPEN;</text><text x="196" y="502" fill="#3d3d3d" text-anchor="end">7</text><text x="230" y="502" fill="#d4d4d4" xml:space="preserve">    s_players = new address payable[](0);</text><text x="196" y="542" fill="#3d3d3d" text-anchor="end">8</text><text x="230" y="542" fill="#d4d4d4" xml:space="preserve">    (bool ok, ) = winner.call{value: address(this).balance}("");</text><text x="196" y="582" fill="#3d3d3d" text-anchor="end">9</text><text x="230" y="582" fill="#d4d4d4" xml:space="preserve">    if (!ok) revert Raffle__TransferFailed();</text><text x="196" y="622" fill="#3d3d3d" text-anchor="end">10</text><text x="230" y="622" fill="#d4d4d4" xml:space="preserve">}</text>
